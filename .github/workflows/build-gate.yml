name: Build Gate (Linux cross-compile)

on:
  workflow_dispatch:

defaults:
  run:
    working-directory: .github/workflows

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm make git curl xz-utils unzip libplist-dev libssl-dev cmake
          clang --version | head -2

      - name: Fetch iOS SDK
        run: |
          set -e
          cd $HOME
          git clone --filter=blob:none --no-checkout --depth 1 https://github.com/theos/sdks.git sdk-repo
          cd sdk-repo
          git sparse-checkout init --cone
          git sparse-checkout set iPhoneOS16.5.sdk
          git checkout
          du -sh iPhoneOS16.5.sdk

      - name: Build ldid
        run: |
          set -e
          cd $HOME
          git clone --depth 1 https://github.com/ProcursusTeam/ldid.git
          cd ldid
          git submodule update --init --recursive --depth 1 || true
          make -j4 || make -j4 || true
          if [ -f ldid ]; then sudo install -m755 ldid /usr/local/bin/ldid; fi
          ldid 2>&1 | head -2 || echo "ldid 未编译出来"

      - name: Build dylib (arm64 iOS)
        run: |
          set -e
          SDK=$HOME/sdk-repo/iPhoneOS16.5.sdk
          clang -target arm64-apple-ios15.0 -isysroot "$SDK" \
                -dynamiclib -fobjc-arc -O2 -Wall -Wno-unused-parameter \
                -framework Foundation -framework UIKit \
                -fuse-ld=lld \
                -Wl,-platform_version,ios,15.0,18.2 \
                -Wl,-install_name,@executable_path/DFGate.dylib \
                -o DFGate.dylib DFGate.m
          ls -lh DFGate.dylib
          python3 - <<'PY'
          import struct
          b=open("DFGate.dylib","rb").read()
          assert b[:4]==b"\xcf\xfa\xed\xfe", b[:4].hex()
          n=struct.unpack("<I", b[16:20])[0]; p=32; ids=[]
          for _ in range(n):
              c,s=struct.unpack("<II", b[p:p+8])
              if c==0xD:
                  no=struct.unpack("<I", b[p+8:p+12])[0]
                  ids.append(b[p+no:p+s].split(b"\x00")[0].decode())
              p+=s
          print("LC_ID_DYLIB:", ids)
          assert ids
          print("DYLIB OK")
          PY

      - name: Inject into IPA
        run: |
          set -e
          python3 inject_lc.py --ipa base.tipa --dylib DFGate.dylib --out gated.tipa
          ls -lh gated.tipa

      - name: Sign app with entitlements (for cross-container access)
        run: |
          set -e
          if ! command -v ldid >/dev/null 2>&1; then
            echo "!! 没有 ldid，跳过敏名（App 将无法访问游戏容器）"
            exit 0
          fi
          mkdir -p work && cd work
          unzip -q -o ../gated.tipa
          APP=$(ls -d Payload/*.app | head -1)
          EXE=""
          for f in "$APP"/*; do
            [ -f "$f" ] || continue
            if [ "$(head -c 4 "$f" | od -An -tx1 | tr -d ' \n')" = "cffaedfe" ]; then
              EXE=$(basename "$f"); break
            fi
          done
          [ -n "$EXE" ] || { echo "!! 找不到 Mach-O 主程序"; exit 1; }
          echo "APP=$APP  EXE=$EXE"
          ldid -S../app_entitlements.plist "$APP/$EXE"
          echo "--- 已写入的 entitlements ---"
          ldid -e "$APP/$EXE" | head -30
          rm -f ../gated.tipa
          zip -qry ../gated.tipa Payload
          cd ..
          ls -lh gated.tipa

      - name: Verify package
        run: |
          python3 - <<'PY'
          import zipfile, struct
          z = zipfile.ZipFile("gated.tipa")
          names = z.namelist()
          assert any(n.endswith("DFGate.dylib") for n in names), "dylib not packed"
          cands = [n for n in names if n.startswith("Payload/") and n.count("/") == 2
                   and not n.endswith("/") and n.rsplit("/", 1)[-1] != "PkgInfo"]
          exe = [n for n in cands if z.read(n)[:4] == b"\xcf\xfa\xed\xfe"] or cands
          print("候选:", cands)
          assert exe, "exe not found"
          b = z.read(exe[0])
          n = struct.unpack("<I", b[16:20])[0]
          p, found = 32, None
          for _ in range(n):
              c, s = struct.unpack("<II", b[p:p+8])
              if c in (0xC, 0x80000018):
                  no = struct.unpack("<I", b[p+8:p+12])[0]
                  found = b[p+no:p+s].split(b"\x00")[0].decode()
              p += s
          print("exe:", exe[0])
          print("LC:", found)
          assert found and "DFGate.dylib" in found
          print("VERIFY OK")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: gated-ipa
          path: .github/workflows/gated.tipa
          retention-days: 7
